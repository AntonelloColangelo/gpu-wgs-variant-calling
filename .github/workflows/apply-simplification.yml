name: Apply repository simplification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository with the reviewed portfolio version
        env:
          README_B64: 
          RUN_B64: 
          SOURCES_B64: 
          GITIGNORE_B64: 
        run: |
          set -Eeuo pipefail

          git rm -r -- \
            .vscode \
            Get-PipelineStatus.ps1 Setup-RemoteAccess.ps1 Start-HG002.ps1 \
            Stop-HG002.ps1 Watch-HG002.ps1 benchmark_giab.sh \
            run_parabricks_hg002.sh scripts reports hg003-deepvariant-vs-gatk \
            docs/iteration-2-plan.md docs/parabricks-basic-commands.md \
            docs/pipeline-validation-20260725.md \
            docs/figures/host_bottleneck.png docs/figures/summary_card.png \
            hg002_snp_false_negatives.py

          git mv hg002_snp_false_negatives.png docs/figures/snp_false_negatives.png
          printf '%s' "$README_B64" | base64 -d > README.md
          printf '%s' "$RUN_B64" | base64 -d > run_hg002.sh
          printf '%s' "$SOURCES_B64" | base64 -d > docs/data-sources.md
          printf '%s' "$GITIGNORE_B64" | base64 -d > .gitignore
          chmod +x run_hg002.sh

          git rm .github/workflows/apply-simplification.yml
          git config user.name "AntonelloColangelo"
          git config user.email "antonello.colangelo@gmail.com"
          git add -A
          git commit -m "Simplify repository and HG002 pipeline"
          git push origin HEAD:main
